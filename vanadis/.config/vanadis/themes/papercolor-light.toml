# PaperColor by Nikyle Nguyen (https://github.com/NLKNguyen/papercolor-theme) を
# もとにした配色。

[meta]
format = 1
name = "PaperColor Light"
variant = "light"
author = "torabit"

# 見た目で名付ける。ロール名を付けると、ANSI スロットの意味を守っていない
# PaperColor ではテンプレートが嘘になる。
[colors]
paper = "#eeeeee"
ink = "#444444"
red = "#af0000"
crimson = "#d70000"
green = "#008700"
olive = "#5f8700"
azure = "#0087af"
teal = "#005f87"
blue = "#005faf"
gray = "#878787"
silver = "#bcbcbc"
ash = "#b2b2b2"
slate = "#767676"
pink = "#d70087"
purple = "#8700af"
orange = "#d75f00"
brown = "#af5f00"
sand = "#d7d7af"
mist = "#e4e4e4"
mint = "#00af5f"
lemon = "#ffff5f"

# 端末の 16 スロット。意味の層とは独立に割り当てる。スロット 10 は名目上
# Bright Green だがピンクを持ち、11 は Bright Yellow で紫、12 は Bright Blue で橙。
[ansi]
0 = "{{colors.paper}}"
1 = "{{colors.red}}"
2 = "{{colors.green}}"
3 = "{{colors.olive}}"
4 = "{{colors.azure}}"
5 = "{{colors.gray}}"
6 = "{{colors.teal}}"
7 = "{{colors.ink}}"
8 = "{{colors.silver}}"
9 = "{{colors.crimson}}"
10 = "{{colors.pink}}"
11 = "{{colors.purple}}"
12 = "{{colors.orange}}"
13 = "{{colors.orange}}"
14 = "{{colors.blue}}"
15 = "{{colors.teal}}"

# 用途で名付ける層。
[role]
bg = "{{colors.paper}}"
fg = "{{colors.ink}}"
comment = "{{colors.gray}}"
keyword = "{{colors.blue}}"
string = "{{colors.olive}}"
function = "{{colors.ink}}"
type = "{{colors.pink}}"
constant = "{{colors.orange}}"
error = "{{colors.red}}"
ok = "{{colors.green}}"
warn = "{{colors.orange}}"
todo = "{{colors.mint}}"
visual = "{{colors.azure}}"
search-bg = "{{colors.lemon}}"
cursor-bg = "{{colors.teal}}"
linenr = "{{colors.ash}}"
accent = "{{colors.pink}}"
accent-alt = "{{colors.teal}}"
accent-warm = "{{colors.orange}}"
inactive = "{{colors.slate}}"
border = "{{colors.silver}}"
selection-bg = "{{colors.sand}}"
hover-bg = "{{colors.mist}}"

# パレットのどの原色でもないティント 4 つ。参照先が無いのでリテラルで書く。
[diff]
added-bg = "#d7ffd7"
added-emph = "#afffaf"
removed-bg = "#ffd7d7"
removed-emph = "#ffafaf"

# 色ではない文字列。variant に追随させる必要があるツール固有のテーマ名を置く。
[text]
delta-syntax-theme = "gruvbox-light"
hunk-base = "github-light-default"
herdr-base = "catppuccin-latte"
# PaperColor は 1 つの colorscheme が &background で light / dark を切り替える。
# 別系統のテーマを足すときはこの値も差し替え、plugins/init.lua に packadd を足す。
nvim-colorscheme = "PaperColor"
