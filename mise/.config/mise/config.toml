[tools]
node = "24.19.0"   # LTS Krypton
ruby = "3.2.2"
rust = "1.98.1"    # 下限は cargo-modules が要求する 1.95
pnpm = "10.34.5"
bun = "1.4.0"      # brew から移管。brew 版は 1.1.20 で止まっていた
"npm:eslint_d" = "latest"
"npm:@fsouza/prettierd" = "latest"   # brew から移管。brew 版は node に依存していた
"npm:yarn" = "1.22.22"   # brew から移管。Yarn Classic のまま維持する

# aqua backend (prebuilt binary, checksum verified)
"aqua:cargo-bins/cargo-binstall" = "latest"
"aqua:EmbarkStudios/cargo-deny" = "latest"
"aqua:rustsec/rustsec/cargo-audit" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
"aqua:mitsuhiko/insta" = "latest"
"aqua:axodotdev/cargo-dist" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"

# github backend (prebuilt binary from GitHub releases)
"github:bnjbvr/cargo-machete" = "latest"
"github:obi1kenobi/cargo-semver-checks" = "latest"
"github:crate-ci/cargo-release" = "latest"
# 日本語文章の lint。crates.io にもあるが SudachiDict をビルド時に
# 埋め込むため cargo backend だと重い。バイナリ実体は 212MB。
"github:nwiizo/suiko" = "latest"

# cargo backend (no prebuilt binary available)
"cargo:bacon" = "latest"
"cargo:cargo-nextest" = "latest"
# 既定の native-tls は linuxbrew の openssl@3 にリンクするが、その libcrypto.so は
# glibc 2.38 の __isoc23_strtol を参照しており rust-lld が
# --no-allow-shlib-undefined で拒否する。rustls にすると openssl を経由しない。
"cargo:sqlx-cli" = { version = "latest", default-features = false, features = "rustls,postgres,mysql,sqlite" }
"cargo:cargo-expand" = "latest"
"cargo:cargo-bloat" = "latest"
"cargo:cargo-llvm-lines" = "latest"
"cargo:cargo-show-asm" = "latest"
"cargo:cargo-modules" = "latest"
"cargo:flamegraph" = "latest"
"cargo:cargo-chef" = "latest"
# 各ツールの config を 1 つのパレットから生成する。prebuilt binary も
# Homebrew tap も未公開なので cargo backend で入れる。手順は docs/COLORS.md。
"cargo:vanadis" = "latest"
# システムの light/dark を監視して vanadis apply を走らせる。常駐は
# heimdallr/.config/systemd/user/heimdallr.service。Homebrew tap は未公開。
"cargo:heimdallr" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "ruby", "rust"]

# 自分のリポジトリの 2 つだけホールドを外す。minimum_release_age は上流の
# リリースが差し替えられた場合に気付く猶予を作るための遅延で、自分が publish
# 元なら買えるものが無い。既定のままだと `latest` が数日前のバージョンに
# 落ちる。vanadis は 0.4.0 に対して 0.3.2、heimdallr は解決先が無くなる。
minimum_release_age_excludes = ["cargo:vanadis", "cargo:heimdallr"]
